
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Access</title>
</head>
<body>
<script>

// =====================================
// GAS設定
// =====================================

const GAS_URL =
'https://script.google.com/macros/s/AKfycbzHXkOS6xl5XrvthxfKRDe7iWLh-jueWb5PY5A22vsZ24jlzyGNC6EbVmtgL8OsSUvi/exec';


// =====================================
// Sites自動更新領域
// GASがこの部分を自動書き換えします
// =====================================

// === SITE_MAP_START ===
const SITE_MAP = {};
// === SITE_MAP_END ===


// =====================================
// 設定
// =====================================

const DEDUPE_TIME = 24 * 60 * 60 * 1000;


// =====================================
// QRコードID取得
// =====================================

const params = new URLSearchParams(location.search);
const logId = params.get('id');


// =====================================
// 遷移処理
// =====================================

if (!logId || !/^QR[0-9]{3}$/.test(logId)) {

  document.body.textContent = 'QRコードが正しくありません。';

} else {

  const site = SITE_MAP[logId];

  if (!site || !site.url) {

    document.body.textContent = '登録されていないQRコードです。';

  } else {

    let target = null;

    try {
      target = new URL(site.url);

      if (target.protocol !== 'https:') {
        throw new Error('HTTPS required');
      }

    } catch (error) {
      document.body.textContent = '遷移先URLが正しくありません。';
    }


    if (target) {

      // =====================================
      // 24時間以内の重複ログ抑制
      // =====================================

      let shouldLog = true;
      const now = Date.now();
      const storageKey = 'QR_LOG_' + logId;

      try {

        const lastTime = Number(localStorage.getItem(storageKey));

        if (lastTime > 0 && now - lastTime < DEDUPE_TIME) {
          shouldLog = false;
        } else {
          localStorage.setItem(storageKey, String(now));
        }

      } catch (error) {
        shouldLog = true;
      }


      // =====================================
      // ログを非同期送信
      // =====================================

      if (shouldLog) {

        const payload = new Blob(
          [JSON.stringify({ logId: logId })],
          { type: 'text/plain;charset=UTF-8' }
        );

        let sent = false;

        try {
          if (navigator.sendBeacon) {
            sent = navigator.sendBeacon(GAS_URL, payload);
          }
        } catch (error) {
          sent = false;
        }

        if (!sent) {
          fetch(GAS_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: payload,
            keepalive: true
          }).catch(() => {});
        }
      }


      // =====================================
      // 即時遷移
      // =====================================

      location.replace(target.href);
    }
  }
}

</script>
</body>
</html>
