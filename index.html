
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Access</title>
</head>
<body>

<script>
'use strict';

const GAS_URL =
'https://script.google.com/macros/s/AKfycbzhcVwo-W_ATE6PEaUj9SO7P-uG4faPdxGTrygnYOwE8ZjsS1_zd-N3vey19w4x_RvJ/exec';

const SITE_MAP = {
  "QR001": {
    "name": "パンフ一覧",
    "url": "https://cinemasoumu2025.github.io/cinema-panphlet/"
  },
  "QR002": {
    "name": "WaterSupply",
    "url": "https://s2h2o.org/student-stories/"
  },
  "QR003": {
    "name": "パンフ一覧",
    "url": "https://cinemasoumu2025.github.io/cinema-panphlet/"
  },
  "QR004": {
    "name": "WaterSupply",
    "url": "https://s2h2o.org/student-stories/"
  }
};

const DEDUPE_TIME = 1 * 60 * 60 * 1000;

const params = new URLSearchParams(
  window.location.search
);

const logId = params.get('id');

if (!logId || !/^QR[0-9]{3}$/.test(logId)) {

  document.body.textContent =
    'QRコードが正しくありません。';

} else {

  const site = SITE_MAP[logId];

  if (!site || !site.url) {

    document.body.textContent =
      '登録されていないQRコードです。';

  } else {

    let target;

    try {
      target = new URL(site.url);

      if (target.protocol !== 'https:') {
        throw new Error('HTTPS required');
      }

    } catch (error) {

      document.body.textContent =
        '遷移先URLが正しくありません。';

    }

    if (target) {

      const storageKey = 'QR_LOG_' + logId;
      const now = Date.now();

      let shouldLog = true;

      try {
        const lastTime = Number(
          localStorage.getItem(storageKey)
        );

        if (
          lastTime > 0 &&
          now - lastTime < DEDUPE_TIME
        ) {
          shouldLog = false;
        }

      } catch (error) {
        shouldLog = true;
      }

      if (shouldLog) {

        const payload = new Blob(
          [JSON.stringify({ logId: logId })],
          {
            type: 'text/plain;charset=UTF-8'
          }
        );

        let queued = false;

        if (navigator.sendBeacon) {
          queued = navigator.sendBeacon(
            GAS_URL,
            payload
          );
        }

        if (!queued) {
          fetch(GAS_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: payload,
            keepalive: true
          }).catch(() => {});
        }

        // 送信受付時点で重複抑制
        try {
          localStorage.setItem(
            storageKey,
            String(now)
          );
        } catch (error) {}
      }

      window.location.replace(target.href);

    }
  }
}
</script>

</body>
</html>
